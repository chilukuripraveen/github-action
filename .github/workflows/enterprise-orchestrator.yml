name: project2

on:
  push:
    branches:
      - main
      - master

jobs:

  # =========================
  # BUILD
  # =========================
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Artifact Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-1
          path: |
            package.json
            package-lock.json
            dist/
            build/


  # =========================
  # TEST
  # =========================
  test:
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test


  # =========================
  # DEPLOY
  # =========================
  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: artifact-1
          path: artifact

      - name: Check Artifact
        run: |
          echo "Downloaded artifact:"
          ls -R artifact

      - name: Deploy Application
        run: |
          echo "Deploying to production server..."
          echo "Deployment completed successfully"


  # =========================
  # INFO
  # Runs independently
  # =========================
  info:
    runs-on: ubuntu-latest

    steps:

      - name: Output of the Job
        run: |
          echo '${{ toJson(github) }}'
