name: Parallel Jobs

on:
  push:
    branches: ["main"]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build
        run: echo "Build job running"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test
        run: echo "Test job running"

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Security Scan
        run: echo "Security scan running"
